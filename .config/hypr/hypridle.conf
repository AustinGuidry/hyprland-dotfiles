listener {
    timeout = 300
    # Match the lock screen itself: the desktop shell runs as quickshell too, and
    # the [l] keeps pgrep from matching this command line.
    on-timeout = pgrep -f 'lock_shel[l].qml' || "$HOME"/qylock/quickshell-lockscreen/lock.sh

}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
