general {
    # Same lock as the idle listener below; runs on `loginctl lock-session`.
    lock_cmd = pgrep -f 'lock_shel[l].qml' || "$HOME"/.local/share/quickshell-lockscreen/lock.sh
    # Lock before any suspend (lid close, idle, manual), and hold the suspend
    # until the lock screen is really up (3 = wait for the session lock), so
    # opening the lid never shows the desktop. elogind caps the wait at 5 s.
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 600
    # Match the lock screen itself: the desktop shell runs as quickshell too, and
    # the [l] keeps pgrep from matching this command line.
    on-timeout = pgrep -f 'lock_shel[l].qml' || "$HOME"/.local/share/quickshell-lockscreen/lock.sh

}

listener {
    timeout = 900
    on-timeout = loginctl suspend
}
