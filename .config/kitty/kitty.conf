# Combined with the old Hyprland `opacity 0.75` rule this landed near ~0.65
# effective background alpha; that rule is gone now, so set it here directly.
# Tune to taste (0 = fully transparent, 1 = fully opaque).
background_opacity 0.65
dynamic_background_opacity yes

# Allow the opacity-toggle hotkey (Hyprland) to talk to kitty at runtime.
allow_remote_control yes
listen_on unix:/tmp/kitty
